<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ufopony</title>
  <style>
    :root {
      --bg: #ffffff;      /* background */
      --ink: #000000;     /* text color */
      --link: #000000;    /* name color */
    }

    html, body {
      height: 100%;
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: system-ui, sans-serif;
    }

    /* left edge, vertically centered */
    .group {
      position: fixed;
      top: 50%;
      left: clamp(1rem, 4vw, 3rem);
      transform: translateY(-50%);
      text-align: left;
      display: flex;
      align-items: center;    /* name and info share the same vertical center */
      gap: 1rem;
    }

    .name {
      all: unset;
      display: block;
      cursor: pointer;
      font-family: system-ui, "Segoe UI Symbol", "Noto Sans Symbols", "Noto Sans Symbols 2", "Noto Sans Egyptian Hieroglyphs", sans-serif;
      font-size: 9pt;
      color: var(--link);
      font-weight: 500;
    }

    .name:focus-visible {
      outline: 1px dotted var(--link);
      outline-offset: 4px;
    }

    /* opens on the left of the name when clicked */
    .info {
      order: -1;
      margin: 0;
      text-align: left;
      white-space: pre;       /* keep line breaks and spaces as written */
      font-family: system-ui, "Segoe UI Symbol", "Noto Sans Symbols", "Noto Sans Symbols 2", "Noto Sans Egyptian Hieroglyphs", sans-serif;
      font-size: 8pt;
      line-height: 1.7;
      color: #000000;
    }

    .info[hidden] {
      display: none;
    }

    /* top text, typed letter by letter */
    .welcome {
      position: fixed;
      top: clamp(1rem, 3vh, 2rem);
      left: 50%;
      transform: translateX(-50%);
      white-space: nowrap;
      text-align: left;
      margin: 0;
      font-family: system-ui, "Segoe UI Symbol", "Noto Sans Symbols", "Noto Sans Symbols 2", "Noto Sans Egyptian Hieroglyphs", sans-serif;
      font-size: min(10pt, 2.8vw);   /* shrinks on narrow screens so it fits */
      line-height: 1.4;
      color: #000000;
    }
  </style>
</head>
