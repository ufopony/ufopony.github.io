<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ufopony</title>
  <style>
    :root {
      --bg: #ffffff;      /* background */
      --ink: #000000;     /* text color */
    }

    html, body {
      height: 100%;
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: system-ui, sans-serif;
    }

    /* top text, typed letter by letter */
    .welcome {
      position: fixed;
      top: clamp(1rem, 3vh, 2rem);
      left: 50%;
      transform: translateX(-50%);
      white-space: nowrap;
      text-align: left;
      margin: 0;
      font-family: system-ui, "Segoe UI Symbol", "Noto Sans Symbols", "Noto Sans Symbols 2", "Noto Sans Egyptian Hieroglyphs", sans-serif;
      font-size: min(10pt, 2.5vw);   /* shrinks on narrow screens so it fits */
      line-height: 1.4;
      color: #000000;
    }
  </style>
</head>
<body>

  <p class="welcome" id="welcome">🅆🄴🄻🄲🄾🄼🄴 ​ 🅃🄾 ​ 🅃🄷🄴 ​ 🄽🄴🅆 ​ 🅂🄿🄰🄲🄴 ​ 🅄🄵🄾🄿🄾🄽🅈</p>

  <script>
    // top text: appears letter by letter from the left
    (function () {
      const el = document.getElementById('welcome');
      const chars = Array.from(el.textContent.trim());   // split by whole characters so symbols are not cut in half
      const SPEED = 100;   // ms per letter (smaller = faster)

      if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;

      el.style.width = el.getBoundingClientRect().width + 'px';   // lock width so typing starts from the left edge
      el.textContent = '';
      let i = 0;
      const timer = setInterval(() => {
        i++;
        el.textContent = chars.slice(0, i).join('');
        if (i >= chars.length) clearInterval(timer);
      }, SPEED);
    })();
  </script>

</body>
</html>
