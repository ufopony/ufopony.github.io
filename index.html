<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ufopony</title>
  <style>
    :root {
      --bg: #ffffff;      /* background */
      --ink: #000000;     /* text color */
      --link: #000000;    /* name color */
    }

    html, body {
      height: 100%;
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: system-ui, sans-serif;
    }

    /* left edge, vertically centered */
    .group {
      position: fixed;
      top: 50%;
      left: clamp(1rem, 4vw, 3rem);
      transform: translateY(-50%);
      text-align: left;
      display: flex;
      align-items: center;    /* name and info share the same vertical center */
      gap: 1rem;
    }

    .name {
      all: unset;
      display: block;
      cursor: pointer;
      font-family: system-ui, "Segoe UI Symbol", "Noto Sans Symbols", "Noto Sans Symbols 2", "Noto Sans Egyptian Hieroglyphs", sans-serif;
      font-size: 9pt;
      color: var(--link);
      font-weight: 500;
    }

    .name:focus-visible {
      outline: 1px dotted var(--link);
      outline-offset: 4px;
    }

    /* opens on the left of the name when clicked */
    .info {
      order: -1;
      margin: 0;
      text-align: left;
      white-space: pre;       /* keep line breaks and spaces as written */
      font- <body>

  <p class="welcome" id="welcome">🅆🄴🄻🄲🄾🄼🄴 ​ 🅃🄾 ​ 🅃🄷🄴 ​ 🅆🄾🅁🄻🄳 ​ 🅄🄵🄾🄿🄾🄽🅈</p>

  <div class="group">
    <button class="name" id="name" aria-expanded="false" aria-controls="info" aria-label="h.am.sun.ism">h꙳a꙳m꙳s꙳u꙳n꙳i꙳s꙳m</button>
    <p class="info" id="info" hidden>| ʳᵃʷ ⠃ ˢᵒᶠᵗ  ⠃ ᵈᵉᶠⁱᵃⁿᵗ 
| ᵍʳᵃᵖʰⁱᶜ ᵈᵉˢⁱᵍⁿ 𓅸  ᴬᴵ ᵛⁱˢᵘᵃˡ ꙳ ♡゚゚゚̥̥̊ 
⁺ • ˚. *࿐ ᵗᵃᵏᵉ ⁱᵗ ˢˡᵒʷ⁺ • ˚. *࿐ ⁺
📧 ᵐʸᵖᵒⁿʸᵃⁿᵈ@ᵍᵐᵃⁱˡ·ᶜᵒᵐ </p>
  </div> <script>
    const nameBtn = document.getElementById('name');
    const info = document.getElementById('info');

    nameBtn.addEventListener('click', () => {
      const open = info.hidden;
      info.hidden = !open;
      nameBtn.setAttribute('aria-expanded', String(open));
    });

    // top text: appears letter by letter from the left
    (function () {
      const el = document.getElementById('welcome');
      const chars = Array.from(el.textContent.trim());   // split by whole characters so symbols are not cut in half
      const SPEED = 100;   // ms per letter (smaller = faster)

      if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;

      el.style.width = el.getBoundingClientRect().width + 'px';   // lock width so typing starts from the left edge
      el.textContent = '';
      let i = 0;
      const timer = setInterval(() => {
        i++;
        el.textContent = chars.slice(0, i).join('');
        if (i >= chars.length) clearInterval(timer);
      }, SPEED);
    })();
  </script>

</body>
</html>
